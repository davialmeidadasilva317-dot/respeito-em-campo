<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071711"><title>RESPEITO EM CAMPO — Jogo de História</title><style>
:root{--lime:#b9ff52;--green:#2bd58c;--bg:#07120e;--panel:#101f19;--white:#f6fff8;--muted:#b9c9bf}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#23543d,#07120e 70%);color:var(--white);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--lime);outline-offset:3px}.wrap{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:clamp(20px,4vw,31px);font-weight:1000;letter-spacing:.04em}.brand span{color:var(--lime)}.pill{background:#14271f;border:1px solid #3d6853;padding:10px 15px;border-radius:30px;font-weight:800}.progress{height:7px;background:#1a3426;border-radius:9px;overflow:hidden;margin:18px 0}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--lime));transition:width .5s}.stadium{position:relative;height:clamp(250px,44vw,430px);border-radius:22px;overflow:hidden;border:1px solid #48745a;box-shadow:0 22px 70px #0009;background:linear-gradient(#071e23 0 35%,#123f32 35% 47%,#176f3f 47% 100%)}.lights{position:absolute;inset:0;background:radial-gradient(ellipse at 16% 0%,#ffffff8c,transparent 23%),radial-gradient(ellipse at 84% 0%,#ffffff8c,transparent 23%);pointer-events:none}.stands{position:absolute;top:20%;height:25%;width:100%;background:repeating-linear-gradient(0deg,#152f29 0 5px,#23473a 5px 8px);border-bottom:6px solid #9fff5d66}.field{position:absolute;bottom:-28%;left:-12%;width:124%;height:78%;transform:perspective(550px) rotateX(27deg);background:repeating-linear-gradient(90deg,#1c8447 0 12.5%,#197640 12.5% 25%);border:3px solid #ffffff70}.field:before{content:"";position:absolute;inset:12%;border:3px solid #ffffff77}.field:after{content:"";position:absolute;left:40%;top:24%;width:20%;aspect-ratio:1;border:3px solid #ffffff77;border-radius:50%}.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(5px,2vw,24px);padding-top:50px}.person{position:relative;width:clamp(48px,9vw,90px);height:clamp(105px,18vw,175px);filter:drop-shadow(0 12px 10px #0008);animation:idle 2.5s ease-in-out infinite alternate}.person:nth-child(even){animation-delay:-1s}.head{position:absolute;top:0;left:28%;width:44%;aspect-ratio:1;border-radius:50%;background:var(--skin);box-shadow:inset -8px -2px #0002}.hair{position:absolute;top:-5%;left:25%;width:50%;height:17%;background:var(--hair);border-radius:70% 70% 30% 30%}.shirt{position:absolute;top:28%;left:15%;width:70%;height:40%;border-radius:13px 13px 7px 7px;background:var(--kit);border-bottom:5px solid #0003}.shirt:after{content:attr(data-num);position:absolute;inset:10% 0;text-align:center;font-weight:1000;font-size:clamp(17px,3vw,31px);color:#fff;text-shadow:0 2px 3px #0008}.arm{position:absolute;top:30%;height:33%;width:15%;background:var(--skin);border-radius:15px}.arm.left{left:0;transform:rotate(13deg)}.arm.right{right:0;transform:rotate(-13deg)}.leg{position:absolute;top:66%;height:33%;width:20%;background:#e7e7e7;border-bottom:12px solid #101c1b;border-radius:0 0 7px 7px}.leg.left{left:22%}.leg.right{right:22%}@keyframes idle{to{transform:translateY(-8px)}}.ball{position:absolute;bottom:12%;left:49%;font-size:38px;animation:ball 2s ease-in-out infinite alternate}@keyframes ball{to{transform:translate(16px,-16px) rotate(35deg)}}.overlay-title{position:absolute;top:7%;left:0;width:100%;text-align:center;font-size:clamp(18px,4vw,38px);font-weight:1000;text-shadow:0 3px 15px #000}.panel{margin-top:18px;background:linear-gradient(145deg,#13291f,#0e1a15);border:1px solid #3c624c;border-radius:20px;padding:clamp(18px,3vw,30px);box-shadow:0 12px 35px #0004}h1,h2,p{margin-top:0}h1{font-size:clamp(28px,6vw,54px);line-height:1.05}h2{font-size:clamp(22px,3vw,30px)}p{line-height:1.6;color:#e1eee5}.eyebrow{font-size:12px;letter-spacing:.17em;font-weight:900;color:var(--lime);text-transform:uppercase}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.choice{background:#193729;color:white;border:1px solid #50785d;border-radius:12px;text-align:left;padding:17px;min-height:83px;transition:.2s}.choice:hover:not(:disabled){background:#245e3d;transform:translateY(-2px)}.choice:disabled{opacity:.58;cursor:default}.choice.selected{border:2px solid var(--lime);opacity:1;background:#275d39}.btn{border:0;background:var(--lime);color:#102019;font-weight:1000;border-radius:12px;padding:15px 23px;box-shadow:0 6px 0 #648d27}.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #648d27}.secondary{background:transparent;border:1px solid #87b697;color:white;box-shadow:none}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.feedback{margin-top:18px;border-left:4px solid var(--lime);padding:15px;background:#203e2b;border-radius:8px;line-height:1.6}.small{font-size:13px;color:var(--muted)}.hidden{display:none!important}.flash{animation:flash 1.4s ease-in-out 2}@keyframes flash{50%{filter:brightness(2)}}.court{background:linear-gradient(#263039 0 40%,#5a4637 40% 100%)}.court .stands,.court .field,.court .ball{display:none}.courtroom{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-evenly;padding:35px 12px 35px}.courtroom .person{animation:none}.bench{position:absolute;bottom:12%;left:29%;width:42%;height:25%;background:linear-gradient(#9a653e,#49301f);border:5px solid #b88757;border-radius:9px;text-align:center;padding-top:10px;font-weight:900;box-shadow:0 15px 20px #0006}.courtlabel{position:absolute;top:12%;width:100%;text-align:center;font-size:clamp(20px,4vw,34px);font-weight:900;text-shadow:0 3px 8px #000}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-15%;width:9px;height:18px;background:var(--c);left:var(--x);animation:fall var(--t) linear infinite;animation-delay:var(--d)}@keyframes fall{to{transform:translateY(520px) rotate(700deg)}}.footer{text-align:center;color:#a5bdb0;font-size:12px;padding:22px}.scoreplus{color:var(--lime);font-weight:900}.story{font-size:17px}.badge{display:inline-block;border:1px solid #79ad8c;border-radius:30px;padding:5px 11px;font-size:12px;color:#d6ffdd;margin-bottom:12px}@media(max-width:600px){.choices{grid-template-columns:1fr}.wrap{padding:12px}.panel{padding:18px}.top{align-items:flex-start}.stadium{height:290px}.scene{padding-top:75px}}
</style><style>
/* Personagens aprimorados: proporções humanas, rosto, uniforme e movimento */
.person{width:clamp(54px,9vw,94px);height:clamp(122px,19vw,190px);transform-origin:50% 95%}

.person .shirt{z-index:3;top:32%;left:21%;width:58%;height:34%;border-radius:18% 18% 12% 12%;background:linear-gradient(100deg,#0003,transparent 25% 75%,#0003),var(--kit);border-top:4px solid #ffffff50;border-bottom:3px solid #0003}
.person .shirt:after{font-size:clamp(16px,2.6vw,27px);inset:14% 0}
.person .arm{z-index:2;top:35%;height:29%;width:13%;background:linear-gradient(90deg,#0002,transparent 55%),var(--skin);border-radius:30px;transform-origin:top center}
.person .arm.left{left:11%;transform:rotate(17deg)}.person .arm.right{right:11%;transform:rotate(-17deg)}

.person .leg.left{left:28%;transform:rotate(4deg)}.person .leg.right{right:28%;transform:rotate(-4deg)}
.person .boot{position:absolute;z-index:4;bottom:0;width:26%;height:7%;background:#101718;border-radius:50% 35% 25% 20%;box-shadow:0 3px 0 #0005}.person .boot.left{left:20%}.person .boot.right{right:20%;transform:scaleX(-1)}

</style></head><body><main class="wrap"><header class="top"><div class="brand">⚽ RESPEITO <span>EM CAMPO</span></div><div class="pill" aria-live="polite">🏆 <span id="score">0</span> / 400 PTS</div></header><div class="progress"><div id="bar"></div></div><section id="stadium" class="stadium" aria-label="Cenário ilustrado de estádio"><div class="stands"></div><div class="field"></div><div class="lights"></div><div class="overlay-title" id="sceneTitle">UMA HISTÓRIA DE CORAGEM</div><div class="scene" id="scene"></div><div class="ball">⚽</div><div id="confetti" class="confetti hidden"></div></section><section class="panel" id="panel" aria-live="polite"></section><footer class="footer">PROJETO ESCOLAR DE HISTÓRIA · RESPEITO EM CAMPO · RACISMO NO ESPORTE</footer></main><script>
'use strict';const $=id=>document.getElementById(id);let stage=-1,score=0,answered=false,cut=0;const players=[['#8c5138','#17211d','#1d9d59','7'],['#d8a17c','#38221b','#f4f4f4','10'],['#583a2c','#111','#31c27c','9'],['#f1cba4','#654329','#161e20','11'],['#ae795b','#181818','#c4e95b','8']];function person(p){return `<div class="person" style="--skin:${p[0]};--hair:${p[1]};--kit:${p[2]}"><div class="arm left"></div><div class="arm right"></div><div class="leg left"></div><div class="leg right"></div><div class="shirt" data-num="${p[3]}"></div><div class="head"><span class="eyes"></span><span class="nose"></span><span class="mouth"></span><span class="ears"></span></div><div class="hair"></div><div class="neck"></div><div class="shorts"></div><div class="boot left"></div><div class="boot right"></div></div>`}function setPlayers(n=3){$('scene').innerHTML=players.slice(0,n).map(person).join('')}function update(){ $('score').textContent=score;$('bar').style.width=`${Math.max(0,stage+1)/4*100}%` }const levels=[
{year:'ATUALIDADE · FUTEBOL',title:'Fase 1 — Vini Jr.: coragem contra o racismo',story:'Vinícius Júnior, atacante brasileiro, tem denunciado episódios de racismo sofridos no futebol espanhol. Durante uma partida, você presencia ofensas racistas vindas da arquibancada. Qual atitude ajuda a combater essa violência?',choices:[['Apoio Vini Jr., comunico a arbitragem e incentivo a denúncia.',100,'Isso! Vini Jr. tem se manifestado publicamente contra o racismo. Apoiar a vítima e acionar os protocolos da competição são atitudes importantes.'],['Peço que ele ignore as ofensas para o jogo continuar.',20,'O racismo não é uma provocação normal do esporte. Não cabe à vítima suportar a violência em silêncio.'],['Digo que os insultos são apenas parte da rivalidade.',0,'Ofensas racistas não são rivalidade esportiva: são discriminação e precisam ser enfrentadas.']]},
{year:'1958–1970 · FUTEBOL',title:'Fase 2 — Pelé: um rei que marcou a história',story:'Pelé conquistou três Copas do Mundo com o Brasil (1958, 1962 e 1970) e tornou-se um símbolo mundial do futebol. Ao pesquisar sua trajetória, um colega afirma que atletas negros tiveram pouca importância para o esporte. Como você responde?',choices:[['Mostro as conquistas de Pelé e valorizo a contribuição dos atletas negros.',100,'Muito bem! Pelé é o único jogador a conquistar três Copas do Mundo masculinas. Sua trajetória ajuda a reconhecer o protagonismo negro na história do futebol.'],['Concordo porque não conheço outros jogadores.',0,'A afirmação apaga contribuições fundamentais. Pesquisar a história de Pelé e de outros atletas negros combate essa invisibilização.'],['Mudo de assunto sem questionar a afirmação.',30,'Evitar a conversa perde uma oportunidade de corrigir uma ideia preconceituosa com fatos históricos.']]},
{year:'2024 · GINÁSTICA ARTÍSTICA',title:'Fase 3 — Rebeca Andrade: talento e representatividade',story:'Nos Jogos Olímpicos de Paris 2024, Rebeca Andrade conquistou quatro medalhas, incluindo o ouro no solo, e se tornou a maior medalhista olímpica do Brasil. Uma pessoa desvaloriza sua conquista por ser uma mulher negra. O que você faz?',choices:[['Reconheço suas conquistas e contesto o comentário preconceituoso.',100,'Excelente! Rebeca Andrade é uma referência histórica da ginástica e do esporte brasileiro. Seu talento merece reconhecimento sem discriminação.'],['Fico em silêncio, mesmo percebendo o preconceito.',20,'O silêncio pode contribuir para a normalização da discriminação. Uma resposta respeitosa e informada pode fazer diferença.'],['Repito o comentário para fazer graça.',0,'Transformar preconceito em piada perpetua o racismo e desrespeita a atleta.']]},
{year:'2024 · JUDÔ',title:'Fase 4 — Beatriz Souza: ouro e respeito',story:'A judoca Beatriz Souza conquistou a medalha de ouro na categoria acima de 78 kg nos Jogos Olímpicos de Paris 2024. Em uma atividade escolar, alguém faz um comentário racista sobre a atleta. Como você age?',choices:[['Interrompo o preconceito, valorizo a conquista e procuro apoio de um responsável.',100,'Perfeito! Beatriz Souza conquistou um ouro histórico para o Brasil. Combater o racismo e valorizar suas conquistas ajuda a construir um esporte mais justo.'],['Deixo o comentário passar para evitar confusão.',20,'Não enfrentar a discriminação permite que ela continue. É possível agir com segurança, respeito e apoio de adultos responsáveis.'],['Concordo com o comentário racista.',0,'Nenhuma conquista esportiva deve ser diminuída por causa da cor da pele. Racismo é discriminação, não opinião esportiva.']]}
];function renderIntro(){stage=-1;score=0;update();$('stadium').classList.remove('court');$('confetti').classList.add('hidden');$('sceneTitle').textContent='UMA HISTÓRIA DE CORAGEM';setPlayers(3);$('panel').innerHTML=`<div class="eyebrow">AVENTURA INTERATIVA · HISTÓRIA E CIDADANIA</div><h1>O respeito entra em campo. <span style="color:var(--lime)">O racismo sai.</span></h1><p class="story">Conheça quatro grandes atletas brasileiros, enfrente decisões difíceis e descubra como atitudes de respeito podem mudar a história.</p><div class="badge">🎮 4 FASES</div> <div class="badge">🏆 ATÉ 400 PONTOS</div> <div class="badge">📚 FATOS HISTÓRICOS</div><div class="actions"><button class="btn" id="start">▶ COMEÇAR AVENTURA</button></div><p class="small">Sem instalação, sem cadastro. Escolha uma resposta em cada fase e leia a explicação.</p>`;$('start').onclick=()=>renderLevel(0)}function renderLevel(i){stage=i;answered=false;update();$('sceneTitle').textContent=levels[i].year;setPlayers(i===3?5:3);const l=levels[i];$('panel').innerHTML=`<div class="eyebrow">MISSÃO ${i+1} DE 4 · ${l.year}</div><h2>${l.title}</h2><p class="story">${l.story}</p><div class="choices" id="choices"></div><div id="feedback" aria-live="polite"></div><div class="actions"><button class="btn hidden" id="next">${i===3?'🎬 ASSISTIR AO FINAL':'PRÓXIMA FASE →'}</button></div>`;l.choices.forEach(([label,points,explain],index)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+index)+'. '+label;b.onclick=()=>choose(index);$('choices').appendChild(b)});$('next').onclick=()=>i===3?startCutscene():renderLevel(i+1)}function choose(index){if(answered)return;answered=true;const [label,points,explain]=levels[stage].choices[index];score+=points;update();[...$('choices').children].forEach((b,i)=>{b.disabled=true;if(i===index)b.classList.add('selected')});$('feedback').innerHTML=`<div class="feedback"><strong class="scoreplus">+${points} PONTOS</strong><p style="margin:8px 0 0">${explain}</p></div>`;$('next').classList.remove('hidden')};function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}async function startCutscene(){const id=++cut;stage=4;update();$('sceneTitle').textContent='JUNTOS SOMOS MAIS FORTES';setPlayers(5);$('stadium').classList.remove('court');$('stadium').classList.add('flash');$('confetti').classList.remove('hidden');$('confetti').innerHTML=Array.from({length:38},(_,i)=>`<i style="--x:${(i*37)%100}%;--c:${['#b9ff52','#fff','#34dca1'][i%3]};--t:${2+i%4}s;--d:-${i%6}s"></i>`).join('');$('panel').innerHTML='<div class="eyebrow">CENA FINAL · UNIÃO</div><h1>O futebol é de todos.<br><span style="color:var(--lime)">O racismo não tem lugar aqui.</span></h1><p>Atletas de diferentes origens se unem no centro do campo. Respeito é uma vitória coletiva.</p><p class="small">A história continua em instantes...</p>';await wait(5600);if(id!==cut)return;$('stadium').classList.remove('flash');$('stadium').classList.add('court');$('confetti').classList.add('hidden');$('sceneTitle').textContent='';$('scene').innerHTML=`<div class="courtroom">${person(['#a06b4d','#1d1613','#243f83',''])}${person(['#c99b7d','#1c1a1a','#242424',''])}${person(['#6e4938','#181818','#253c5a',''])}<div class="bench">⚖️ JUSTIÇA</div></div><div class="courtlabel">RACISMO TEM CONSEQUÊNCIAS</div>`;$('panel').innerHTML='<div class="eyebrow">CENA ILUSTRATIVA · RESPONSABILIZAÇÃO</div><h2>Respeito também é responsabilidade.</h2><p>Em um tribunal fictício, um personagem acusado de racismo responde perante a Justiça. Um juiz conduz a audiência e um policial acompanha a cena. A responsabilização depende da apuração dos fatos, do devido processo legal e da legislação aplicável.</p><p class="small">Cena dramatizada, sem referência a um caso judicial específico.</p>';await wait(6500);if(id!==cut)return;renderCredits()}function renderCredits(){ $('sceneTitle').textContent='RESPEITO É NOSSA MAIOR VITÓRIA';$('stadium').classList.remove('court');setPlayers(5);$('panel').innerHTML=`<div class="eyebrow">FIM DE JOGO · CRÉDITOS</div><h1>Você marcou <span style="color:var(--lime)">${score}/400</span> pontos!</h1><p>${score===400?'Pontuação perfeita! Suas decisões mostraram compromisso com a igualdade e o respeito.':score>=250?'Bom trabalho! Você tomou decisões importantes e pode continuar aprendendo.':'Cada escolha é uma oportunidade de aprender e combater o preconceito.'}</p><h2>Créditos do projeto</h2><p><strong>Projeto escolar de História</strong><br>Nome: Respeito em Campo<br>Tema: Racismo no esporte<br>Pesquisa, roteiro e desenvolvimento: trabalho do aluno.</p><p class="small">Conteúdo histórico: Vini Jr. e o combate ao racismo no futebol; Pelé e suas três Copas do Mundo; Rebeca Andrade e Beatriz Souza nos Jogos Olímpicos de Paris 2024. As situações de escolha são dramatizações educativas.</p><div class="actions"><button class="btn" id="restart">↻ JOGAR NOVAMENTE</button><button class="btn secondary" id="share">📋 COPIAR RESULTADO</button></div>`;$('restart').onclick=()=>{cut++;renderIntro()};$('share').onclick=async()=>{const t=`Concluí RESPEITO EM CAMPO com ${score}/400 pontos! O futebol é de todos. O racismo não tem lugar aqui.`;try{await navigator.clipboard.writeText(t);$('share').textContent='✓ RESULTADO COPIADO'}catch(e){$('share').textContent='Cópia indisponível neste navegador'}}}renderIntro();
</script></body></html>
